<!DOCTYPE html>
<html>

<head>

    <title>Registration</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid vh-100
            d-flex justify-content-center align-items-center">

    <div class="card shadow-lg border-0 rounded-4
                px-5 py-4"
         style="width:430px;">

        <div class="text-center mb-2">

            <img id="profilePicture"
                 class="rounded-circle border"
                 width="120"
                 height="120"
                 referrerpolicy="no-referrer"
                 alt="Profile Picture">

        </div>

        <h3 class="text-center mb-4">
            Complete Registration
        </h3>


        <div id="errorMessage"
             class="alert alert-danger d-none">
        </div>


        <form id="registerForm">

            <div class="mb-3">

                <label class="form-label">
                    Name
                </label>

                <input id="name"
                       type="text"
                       class="form-control"
                       readonly>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input id="email"
                       type="email"
                       class="form-control"
                       readonly>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Phone Number
                </label>

                <input id="phoneNumber"
                       type="text"
                       class="form-control"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Department
                </label>

                <input id="department"
                       type="text"
                       class="form-control"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Designation
                </label>

                <input id="designation"
                       type="text"
                       class="form-control"
                       required>

            </div>


            <button type="submit"
                    class="btn btn-primary w-100">

                Register

            </button>

        </form>

    </div>

</div>

<script src="/js/register.js"></script>

</body>
</html>
