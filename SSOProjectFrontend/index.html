<!DOCTYPE html>
<html>

<head>
    <title>Fragma Data</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container min-vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow-lg border-0 rounded-4 p-4"
     style="max-width:550px; width:100%;">

        <div class="text-center mb-3">

            <img src="./images/fragma.png"
                 alt="Fragma Data"
                 class="img-fluid"
                 style="max-width:190px;">

        </div>

        <p class="text-center mb-4">

            <span class="text-dark fw-semibold">
                Sign in
            </span>

            <span class="text-secondary">
                to Fragma Data
            </span>

        </p>


        <!-- GOOGLE -->

       <a href="http://localhost:8080/api/auth/login/google"
           class="btn btn-light border rounded-3 py-3
                  d-flex align-items-center justify-content-center
                  shadow-sm">

            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                width="22"
                height="22"
                class="me-3">

            <span class="fw-semibold">
                Continue with Google
            </span>

        </a>


    


        <hr class="my-3">


   <!-- AWS -->

        <a href="http://localhost:8080/api/auth/login/cognito"
           class="btn btn-light border rounded-3 py-3
                  d-flex align-items-center justify-content-center
                  shadow-sm">
                  
           <img
    src="https://upload.wikimedia.org/wikipedia/commons/9/93/Amazon_Web_Services_Logo.svg"
    width="29"
    height="29"
    class="me-3">       

            <span class="fw-semibold">
                Continue with AWS
            </span>

        </a>
  <hr class="my-3">
        <!-- AZURE -->

        <a href="http://localhost:8080/api/auth/login/azure"
           class="btn btn-light border rounded-3 py-3
                  d-flex align-items-center justify-content-center
                  shadow-sm">
      
   <img
        src="https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/microsoft/default.svg"
        width="22"
        height="22"
        class="me-3"
        alt="Microsoft">
        
            <span class="fw-semibold">
                Continue with Microsoft / Azure
            </span>

        </a>


      


     


        <hr class="my-4">

        <p class="text-center text-secondary small mb-0">

            Secure authentication powered by

            <span class="text-primary fw-semibold">
                OAuth 2.0
            </span>

        </p>

    </div>

</div>

</body>
</html>
